[build]
   command = "npm run build"
   publish = "dist"

[dev]
   command = "npm run dev"

# Netlify CDN cache for server-rendered HTML pages
[[headers]]
   for = "/*"
   [headers.values]
      Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=86400"
      Netlify-CDN-Cache-Control = "public, max-age=300, s-maxage=300, stale-while-revalidate=86400"

# Cache headers for static assets
[[headers]]
   for = "/img/*"
   [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
   for = "/*.jpg"
   [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
   for = "/*.png"
   [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
   for = "/*.webp"
   [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
   for = "/*.jpeg"
   [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
   for = "/*.mp4"
   [headers.values]
      Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
   from = "/online/*"
   to = "/"
   status = 301

[[redirects]]
   from = "/home"
   to = "/humannexus"
   status = 301

[[redirects]]
   from = "/services"
   to = "/humannexus/services"
   status = 301

[[redirects]]
   from = "/programs"
   to = "/humannexus/programs"
   status = 301

[[redirects]]
   from = "/team"
   to = "/humannexus/team"
   status = 301

[[redirects]]
   from = "/partners"
   to = "/humannexus/partners"
   status = 301

[[redirects]]
   from = "/contacts"
   to = "/humannexus/contacts"
