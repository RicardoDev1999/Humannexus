name: Purge Netlify CDN Cache

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge-cache:
    name: Purge Netlify cache
    runs-on: ubuntu-latest

    steps:
      - name: Purge site cache
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -euo pipefail

          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "NETLIFY_AUTH_TOKEN and NETLIFY_SITE_ID repository secrets are required."
            exit 1
          fi

          npx --yes netlify-cli api purgeCache \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}"

          echo "Netlify CDN cache purged successfully."
